x-backend-env: &backend-env
  SECRET_KEY: ${SECRET_KEY:?}
  DEBUG: ${DEBUG:-False}
  DOCS_ENABLED: ${DOCS_ENABLED:-False}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-poketlawyer.app,api.poketlawyer.app}
  DB_HOST: db
  DB_NAME: ${DB_NAME:-pocket_lawyer}
  DB_USER: ${SERVICE_USER_POSTGRES}
  DB_PASS: ${SERVICE_PASSWORD_64_POSTGRES}
  CELERY_BROKER_URL: amqp://${SERVICE_USER_RABBIT}:${SERVICE_PASSWORD_64_RABBIT}@mq:5672//
  DJANGO_CRYPTO_KEY: ${DJANGO_CRYPTO_KEY:?}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  OMNIROUTE_BASE_URL: ${OMNIROUTE_BASE_URL:-}
  OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY:-}
  OMNIROUTE_MODEL: ${OMNIROUTE_MODEL:-ddgw/tinfoil/gpt-oss-120b}
  OMNIROUTE_FALLBACK_MODELS: ${OMNIROUTE_FALLBACK_MODELS:-ddgw/gpt-5.6-luna,ddgw/tinfoil/gemma4-31b}
  OMNIROUTE_DAILY_LIMIT: ${OMNIROUTE_DAILY_LIMIT:-50}
  LEGAL_RAG_TOP_K: ${LEGAL_RAG_TOP_K:-20}
  LEGAL_RAG_MIN_SCORE: ${LEGAL_RAG_MIN_SCORE:-0.0}
  LEGAL_RAG_EMBEDDING_PROVIDER: ${LEGAL_RAG_EMBEDDING_PROVIDER:-gemini}
  LEGAL_RAG_EMBEDDING_MODEL: ${LEGAL_RAG_EMBEDDING_MODEL:-text-embedding-004}
  LEGAL_RAG_EMBEDDING_DIM: ${LEGAL_RAG_EMBEDDING_DIM:-768}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  EMAIL_HOST: ${EMAIL_HOST:-smtp.resend.com}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@poketlawyer.app}

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-pocket_lawyer}
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SERVICE_USER_POSTGRES} -d ${DB_NAME:-pocket_lawyer}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mq:
    image: rabbitmq:3.13-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${SERVICE_USER_RABBIT}
      RABBITMQ_DEFAULT_PASS: ${SERVICE_PASSWORD_64_RABBIT}
    volumes:
      - mq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn core.wsgi:application --bind 0.0.0.0:8001 --workers 3 --timeout 120"
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
      mq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    command: celery -A core worker -l INFO --concurrency=2
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
      mq:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.poketlawyer.app/v1/api}
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  db-data:
  mq-data:
