services:
  # main frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - 3000:3000
    volumes:
      - ./frontend:/frontend
      - /frontend/node_modules
    command: npm run dev
    environment:
      - VITE_API_URL=http://localhost:8001

  # main backend
  backend:
    working_dir: /backend
    
    build:
      context: .
    ports:
      - 8001:8001
    volumes:
      - ./backend:/backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8001"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG}
      - DOCS_ENABLED=${DOCS_ENABLED}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DJANGO_CRYPTO_KEY=${DJANGO_CRYPTO_KEY}
      - OMNIROUTE_BASE_URL=${OMNIROUTE_BASE_URL}
      - OMNIROUTE_API_KEY=${OMNIROUTE_API_KEY}
      - OMNIROUTE_MODEL=${OMNIROUTE_MODEL}
      - OMNIROUTE_FALLBACK_MODELS=${OMNIROUTE_FALLBACK_MODELS}
      - OMNIROUTE_DAILY_LIMIT=${OMNIROUTE_DAILY_LIMIT}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}
      - LEGAL_RAG_TOP_K=${LEGAL_RAG_TOP_K}
      - LEGAL_RAG_CANDIDATE_K=${LEGAL_RAG_CANDIDATE_K}
      - LEGAL_RAG_MIN_SCORE=${LEGAL_RAG_MIN_SCORE}
      - LEGAL_RAG_MAX_CONTEXT_CHARS=${LEGAL_RAG_MAX_CONTEXT_CHARS}
      - LEGAL_RAG_EMBEDDING_PROVIDER=${LEGAL_RAG_EMBEDDING_PROVIDER}
      - LEGAL_RAG_EMBEDDING_MODEL=${LEGAL_RAG_EMBEDDING_MODEL}
      - LEGAL_RAG_EMBEDDING_DIM=${LEGAL_RAG_EMBEDDING_DIM}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - PYTHONDONTWRITEBYTECODE=1
    depends_on:
      db:
        condition: service_healthy

  # main database
  db:
    image: pgvector/pgvector:pg17
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "${DB_NAME}", "-U", "${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
      
    # message broker
  mq:
    image: rabbitmq:3.13.7-alpine
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}

  # message scheduling celery
  worker:
    working_dir: /backend

    build:
      context: .
    volumes:
      - ./backend:/backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      sh -c "celery -A core worker -l INFO"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG}
      - DOCS_ENABLED=${DOCS_ENABLED}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DJANGO_CRYPTO_KEY=${DJANGO_CRYPTO_KEY}
      - OMNIROUTE_BASE_URL=${OMNIROUTE_BASE_URL}
      - OMNIROUTE_API_KEY=${OMNIROUTE_API_KEY}
      - OMNIROUTE_MODEL=${OMNIROUTE_MODEL}
      - OMNIROUTE_FALLBACK_MODELS=${OMNIROUTE_FALLBACK_MODELS}
      - OMNIROUTE_DAILY_LIMIT=${OMNIROUTE_DAILY_LIMIT}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}
      - LEGAL_RAG_TOP_K=${LEGAL_RAG_TOP_K}
      - LEGAL_RAG_CANDIDATE_K=${LEGAL_RAG_CANDIDATE_K}
      - LEGAL_RAG_MIN_SCORE=${LEGAL_RAG_MIN_SCORE}
      - LEGAL_RAG_MAX_CONTEXT_CHARS=${LEGAL_RAG_MAX_CONTEXT_CHARS}
      - LEGAL_RAG_EMBEDDING_PROVIDER=${LEGAL_RAG_EMBEDDING_PROVIDER}
      - LEGAL_RAG_EMBEDDING_MODEL=${LEGAL_RAG_EMBEDDING_MODEL}
      - LEGAL_RAG_EMBEDDING_DIM=${LEGAL_RAG_EMBEDDING_DIM}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - PYTHONDONTWRITEBYTECODE=1

    depends_on:
      - backend
      - mq

  # Host Ollama is bound to 127.0.0.1:11434; expose it to the backend/worker.
  ollama-proxy:
    image: alpine/socat
    network_mode: host
    restart: unless-stopped
    command: TCP-LISTEN:11435,fork,reuseaddr TCP:127.0.0.1:11434

volumes:
  db-data: